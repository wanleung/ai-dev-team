name: 🧪 Run Tests on PR

# Auto-run tests whenever an AI agent opens or updates a feature branch PR
on:
  pull_request:
    branches: [main, master]
    paths:
      - "tests/**"
      - "**.py"
      - "requirements*.txt"
      - "docker-compose*.yml"
      - "Dockerfile"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to run tests for"
        required: false
        type: number

jobs:
  unit-test:
    name: pytest (unit + integration)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install app dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt -q
          fi

      - name: Install test dependencies
        run: |
          if [ -f requirements-test.txt ]; then
            pip install -r requirements-test.txt -q
          else
            pip install pytest pytest-cov httpx -q
          fi

      - name: Run tests
        id: run_tests
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_deployment.py \
            --cov=. --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -p no:cacheprovider \
            2>&1 | tee test_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post test results to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS="${{ steps.run_tests.outcome }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            LABEL="All unit tests passed"
          else
            EMOJI="❌"
            LABEL="Some unit tests failed"
          fi
          OUTPUT=$(tail -60 test_output.txt 2>/dev/null || echo "No output captured")
          gh pr comment "${{ github.event.pull_request.number }}" --body "## 🏃 Unit Test Results

**Status:** ${EMOJI} ${LABEL}

\`\`\`
${OUTPUT}
\`\`\`"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  deploy-test:
    name: Docker deployment smoke tests
    runs-on: ubuntu-latest
    needs: unit-test
    if: hashFiles('docker-compose.test.yml') != ''
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke test dependencies
        run: pip install pytest httpx -q

      - name: Build and start test stack
        run: |
          docker compose -f docker-compose.test.yml up -d --build
          echo "Waiting for services to be healthy..."

      - name: Wait for healthy
        run: |
          for i in $(seq 1 24); do
            STATUS=$(docker compose -f docker-compose.test.yml ps --format json 2>/dev/null || echo "")
            if echo "$STATUS" | grep -q '"Health":"healthy"'; then
              echo "✅ Services healthy"
              break
            fi
            echo "Attempt $i/24 — waiting 5s..."
            sleep 5
          done
          docker compose -f docker-compose.test.yml ps

      - name: Run smoke tests
        id: smoke
        env:
          BASE_URL: "http://localhost:8000"
        run: |
          pytest tests/test_deployment.py -v --tb=short 2>&1 | tee deploy_test_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

      - name: Post deployment test results to PR
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS="${{ steps.smoke.outcome }}"
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            LABEL="Deployment smoke tests passed"
          else
            EMOJI="❌"
            LABEL="Deployment smoke tests failed"
          fi
          OUTPUT=$(tail -60 deploy_test_output.txt 2>/dev/null || echo "No output captured")
          gh pr comment "${{ github.event.pull_request.number }}" --body "## 🐳 Deployment Smoke Test Results

**Status:** ${EMOJI} ${LABEL}

\`\`\`
${OUTPUT}
\`\`\`"
