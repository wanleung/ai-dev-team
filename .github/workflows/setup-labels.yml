name: 🏷️ Setup AI Labels

# Run once manually to create the required labels in this repo
on:
  workflow_dispatch:

jobs:
  create-labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create ai-fix label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "ai-fix" \
            --repo ${{ github.repository }} \
            --color "d93f0b" \
            --description "Trigger AI bug-fix pipeline" \
            --force

      - name: Create ai-feature label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "ai-feature" \
            --repo ${{ github.repository }} \
            --color "0075ca" \
            --description "Trigger AI feature-build pipeline" \
            --force

      - name: Create prd label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "prd" \
            --repo ${{ github.repository }} \
            --color "e4e669" \
            --description "Product Requirements Document" \
            --force

      - name: Create ai-generated label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "ai-generated" \
            --repo ${{ github.repository }} \
            --color "bfd4f2" \
            --description "Content generated by AI agents" \
            --force

      - name: Summary
        run: |
          echo "✅ Labels created:"
          echo "  - ai-fix       → triggers bug-fix pipeline"
          echo "  - ai-feature   → triggers feature-build pipeline"
          echo "  - prd          → marks PRD issues"
          echo "  - ai-generated → marks AI-generated issues/PRs"
