# AI Software House — Repo Watcher Configuration
# The watcher reads this file hourly and dispatches agent pipelines for
# any open, unprocessed issues it finds.
#
# State labels applied by the watcher (auto-created if missing):
#   agent-queued    — picked up this run, about to start
#   agent-running   — pipeline is actively running
#   agent-complete  — pipeline finished successfully
#   agent-failed    — pipeline encountered an unrecoverable error
#
# Issues are skipped if they already have any of the above labels.
#
# feature_label / bug_label accept a single string OR a list of strings.
# Issues matching ANY of the listed labels are queued (deduped automatically).
#
# Example with new per-label pipeline mapping and parallel issue handling:
#
# watchers:
#   - tracker_repo: owner/my-tracker
#     default_target: owner/my-app
#     enabled: true
#     parallel_issues: 2          # process up to 2 issues concurrently for this repo
#     labels:
#       ai-feature: {}            # uses pipelines/ai-feature.yaml
#       ai-fix: {}                # uses pipelines/ai-fix.yaml
#       ai-docs: {}               # uses pipelines/ai-docs.yaml
#       ai-refactor:              # custom label — create pipelines/ai-refactor.yaml
#         pipeline: ai-refactor   # explicit map (optional; defaults to label name)
#
# Backwards-compat: feature_label / bug_label still work.

watchers:

    # ── Watcher 1: Central agency — issues in ai-software-house repo ───────
    # Multiple trigger labels: "feature-request" OR "ai-build" both work.
    # Target repo is read from the issue body ("**Target repo:** owner/repo").
  - tracker_repo: wanleung/ai-software-house
    default_target: ~
    parallel_issues: 2
    labels:
      ai-feature: ai-feature      # label → pipeline name (matches pipelines/ai-feature.yaml)
      enhancement: ai-feature
      ai-build: ai-feature
      feature-request: ai-feature
      ai-fix:     ai-fix
      bug: ai-fix
      ai-docs:    ai-docs
      documentation: ai-docs
    enabled: true

    # Additional watcher entries have been migrated to repos-available/.
    # Use `python watcher.py repo enable <name>` to activate them.

    # ── Watcher 2: PR/Marketing Campaign Pipeline ──────────────────────────
    # Monitors wanleung/pr-campaigns for issues labelled "pr-campaign".
    # Runs the pr-campaign pipeline (pipelines/pr-campaign.yaml).
  - tracker_repo: wanleung/pr-campaigns
    default_target: wanleung/pr-campaigns
    parallel_issues: 1
    labels:
      pr-campaign: pr-campaign
    enabled: true

settings:
  # Maximum parallel pipeline runs (one per issue)
  max_parallel: 3

  # Path to write per-run logs (relative to this file's directory)
  log_dir: ./logs/watcher

  # Number of engineer agents per pipeline run
  num_engineers: 1

  # Default LLM model (overridden by config.yaml per-agent settings)
  model: "gpt-4.1"
