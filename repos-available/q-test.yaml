tracker_repo: wanleung/q-test
default_target: ~
parallel_issues: 5
labels:
  ai-feature: tdd
  ai-fix: ai-smart-fix
enabled: true

settings:
  watch_prs: true
  pr_fix_label: "ai-fix"
  pr_failure_pattern: "❌|FAILED|tests? failed|test suite failed"
  max_pr_retries: 5
  watch_draft_prs: true
  pipeline:
    chaining:
      on_test_failure: "ai-fix"
      on_review_issues: "ai-fix"

