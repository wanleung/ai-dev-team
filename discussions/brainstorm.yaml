# discussions/brainstorm.yaml
# Generic multi-perspective brainstorm preset.
# Suitable for: proposal generation, feature ideation, architecture decisions.
#
# Usage in pipeline.yaml:
#   stages:
#     - pm
#     - architect
#     - discuss_brainstorm
#     - reviewer
#     - engineer

participants:
  - role: analyst
    persona_file: roles/analyst.md
    llm: "opencode-zen/mimo-v2.5-free"
    homework_llm: "opencode-zen/mimo-v2.5-free"
    #llm: "opencode-go/qwen3.6-plus"          # fast model for discussion rounds
    #homework_llm: "dashscope/qwen3.5-plus"  # slow+tools model for homework research

  - role: skeptic
    persona_file: roles/skeptic.md
    llm: "opencode-zen/mimo-v2.5-free"
    homework_llm: "opencode-zen/mimo-v2.5-free"
    #llm: "opencode-go/qwen3.6-plus"
    #homework_llm: "dashscope/qwen3.5-plus"

  - role: optimist
    persona_file: roles/optimist.md
    llm: "opencode-zen/mimo-v2.5-free"
    homework_llm: "opencode-zen/mimo-v2.5-free"
    #llm: "opencode-go/qwen3.6-plus"
    #homework_llm: "dashscope/qwen3.5-plus"

homework_round: true    # each participant thinks independently before the group discussion
max_rounds: 3           # up to 2 discussion rounds after homework
early_exit: CONSENSUS_REACHED

moderator:
  persona_file: roles/moderator.md

output_mode: both       # downstream stages get both transcript and synthesis

context_fields:
  - spec
  - design
  - issue_body
