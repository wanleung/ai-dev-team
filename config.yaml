# AI Software House Configuration
# Copy this file and edit to match your setup.

# ── LLM Settings ───────────────────────────────────────────────────────────
llm:
  # Default model for all agents (used when no per-agent override is set)
  # GitHub Models API options:
  #   OpenAI  : gpt-4.1, gpt-4.1-mini, gpt-4.1-nano, gpt-4o, gpt-4o-mini, o4-mini, o3
  #   Anthropic: claude-3.5-sonnet, claude-3.7-sonnet, claude-3-haiku
  #   Meta     : meta-llama-3.3-70b-instruct, meta-llama-3.1-405b-instruct
  #   Mistral  : mistral-large-2411, mistral-small-2503
  #   DeepSeek : deepseek-r1, deepseek-v3
  #   Cohere   : cohere-command-r-plus
  #model: "gpt-4.1"
  model: "claude-4.6-sonnet"

  # Per-agent model overrides — each agent can use a different LLM.
  # Agent names: product_manager, pm_reviewer, architect, architect_reviewer, engineer, code_reviewer, qa_planner, qa_engineer, deployment_tester
  # Tip: use a powerful model for PM/Architect (reasoning-heavy), fast/cheap for Engineer (repetitive).
  overrides:
    product_manager: "claude-4.6-sonnet"           # Requirements analysis — needs good reasoning
    pm_reviewer: "gpt-5.3-codex"               # PRD review — needs critical thinking
    architect: "claude-4.6-opus"                 # System design — needs good reasoning
    architect_reviewer: "gpt-5.3-codex"        # Design review — needs critical thinking
    engineer: "claude-4.6-sonnet"             # Code writing — runs many times, use cheaper model
    code_reviewer: "claude-4.6-sonnet"             # Code review — needs accuracy
    qa_planner: "gpt-5.3-codex"                # Test planning — needs strong reasoning
    qa_engineer: "claude-4.6-sonnet"          # Test writing — repetitive, cheaper model fine
    deployment_tester: "gpt-4.1-mini"    # Smoke test generation

# ── GitHub Settings ─────────────────────────────────────────────────────────
github:
  # Target repository in 'owner/repo' format
  # This is where the team will create issues, branches, PRs
  repo: "your-username/your-repo"

  # Branch prefix for engineer feature branches
  branch_prefix: "feature/agent"

# ── Team Composition ────────────────────────────────────────────────────────
team:
  # Number of parallel Engineer agents (each handles a separate module)
  num_engineers: 2

  # Enable/disable specific agents
  agents:
    product_manager: true
    pm_reviewer: true
    architect: true
    engineer: true
    code_reviewer: true
    qa_planner: true
    qa_engineer: true
    deployment_tester: true

# ── Pipeline Settings ────────────────────────────────────────────────────────
pipeline:
  # Directory where generated code workspace will be written locally
  workspace_dir: "./workspace"

  # Stop the pipeline if the code reviewer requests changes
  stop_on_review_issues: false

  # Maximum retries per agent call on API failure
  max_retries: 2

