# AI Software House Configuration
# Copy this file and edit to match your setup.

# ── LLM Settings ───────────────────────────────────────────────────────────
llm:
  # Default model for all agents (used when no per-agent override is set)
  # GitHub Models API endpoint: https://models.github.ai/inference
  # Confirmed working model IDs (tested live):
  #   OpenAI   : openai/gpt-4.1, openai/gpt-4.1-mini, openai/gpt-4.1-nano
  #   Mistral  : mistral-ai/mistral-small-2503
  #   DeepSeek : deepseek/deepseek-r1
  #   Meta     : meta-llama-3.1-405b-instruct
  #
  # NOTE: Claude models (anthropic/*) are NOT available on GitHub Models free tier.
  #       "claude-4.6-sonnet" is the internal model powering GitHub Copilot CLI — not
  #       usable via the GitHub Models API.
  model: "openai/gpt-4.1"

  # Per-agent model overrides — each agent can use a different LLM.
  # Agent names: product_manager, pm_reviewer, architect, architect_reviewer,
  #              engineer, code_reviewer, qa_planner, qa_engineer, deployment_tester
  # Tip: use a powerful model for PM/Architect (reasoning-heavy), fast/cheap for Engineer (repetitive).
  overrides:
    product_manager: "openai/gpt-4.1"          # Requirements analysis — needs good reasoning
    pm_reviewer: "openai/gpt-4.1"              # PRD review — needs critical thinking
    architect: "openai/gpt-4.1"                # System design — needs good reasoning
    architect_reviewer: "openai/gpt-4.1"       # Design review — needs critical thinking
    engineer: "openai/gpt-4.1-mini"            # Code writing — runs many times, use cheaper model
    code_reviewer: "openai/gpt-4.1"            # Code review — needs accuracy
    qa_planner: "openai/gpt-4.1"               # Test planning — needs strong reasoning
    qa_engineer: "openai/gpt-4.1-mini"         # Test writing — repetitive, cheaper model fine
    deployment_tester: "openai/gpt-4.1-mini"   # Smoke test generation

# ── GitHub Settings ─────────────────────────────────────────────────────────
github:
  # Target repository in 'owner/repo' format
  # This is where the team will create issues, branches, PRs
  repo: "your-username/your-repo"

  # Branch prefix for engineer feature branches
  branch_prefix: "feature/agent"

# ── Team Composition ────────────────────────────────────────────────────────
team:
  # Number of parallel Engineer agents (each handles a separate module)
  num_engineers: 2

  # Enable/disable specific agents
  agents:
    product_manager: true
    pm_reviewer: true
    architect: true
    engineer: true
    code_reviewer: true
    qa_planner: true
    qa_engineer: true
    deployment_tester: true

# ── Pipeline Settings ────────────────────────────────────────────────────────
pipeline:
  # Directory where generated code workspace will be written locally
  workspace_dir: "./workspace"

  # Stop the pipeline if the code reviewer requests changes
  stop_on_review_issues: false

  # Maximum retries per agent call on API failure
  max_retries: 2

