version: "3.8"

services:
  rag-mcp:
    build:
      context: .
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set (e.g. postgresql://user:pass@host:5432/dbname)}
      EMBED_BACKEND: ${EMBED_BACKEND:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-nomic-embed-text}
      # VLLM_BASE_URL: http://192.168.1.x:8000
      # VLLM_MODEL: BAAI/bge-m3
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MAX_TOP_K: ${RAG_MAX_TOP_K:-100}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
