<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🧩 Pipeline Config Builder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #1e1e2e; color: #cdd6f4; min-height: 100vh; }
  header { background: #181825; padding: 12px 20px; display: flex;
           justify-content: space-between; align-items: center;
           border-bottom: 1px solid #313244; }
  header h1 { font-size: 16px; }
  .btn { background: #a6e3a1; color: #1e1e2e; border: none; border-radius: 6px;
         padding: 6px 16px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .btn:hover { background: #94d49a; }
  .btn-secondary { background: #313244; color: #cdd6f4; }
  .btn-secondary:hover { background: #45475a; }
  .layout { display: flex; height: calc(100vh - 49px); }
  .palette { width: 160px; background: #181825; border-right: 1px solid #313244;
             padding: 12px; overflow-y: auto; }
  .palette h3 { font-size: 11px; text-transform: uppercase; color: #6c7086;
                margin-bottom: 10px; letter-spacing: 0.05em; }
  .palette-item { background: #313244; border-radius: 6px; padding: 7px 10px;
                  font-size: 12px; cursor: grab; margin-bottom: 5px;
                  border: 1px solid transparent; user-select: none; }
  .palette-item:hover { border-color: #89b4fa; }
  .palette-item.loop-block { border-color: #f9e2af; color: #f9e2af; }
  .palette-item.discuss-block { border-color: #a6e3a1; color: #a6e3a1; }
  .discuss-item { border: 2px solid #a6e3a1; border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; }
  .discuss-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: bold; color: #a6e3a1; }
  .discuss-form label { font-size: 11px; color: #cdd6f4; display: block; margin-top: 6px; }
  .discuss-form input, .discuss-form select, .discuss-form textarea {
    background: #1e1e2e; border: 1px solid #6c7086; border-radius: 4px;
    color: #cdd6f4; padding: 3px 6px; width: 100%; box-sizing: border-box; font-size: 12px;
  }
  .discuss-form textarea { height: 60px; resize: vertical; }
  .discuss-mode-toggle { display: flex; gap: 4px; margin-bottom: 8px; }
  .discuss-mode-btn { background: #313244; border: 1px solid #6c7086; border-radius: 4px;
    color: #6c7086; padding: 2px 8px; font-size: 11px; cursor: pointer; }
  .discuss-mode-btn.active { background: #a6e3a1; border-color: #a6e3a1; color: #1e1e2e; font-weight: 600; }
  .participant-row { background: #2a2a3e; border-radius: 5px; padding: 5px 8px;
    margin-bottom: 4px; }
  .participant-row-header { display: flex; align-items: center; gap: 6px; }
  .participant-role-input { background: #1e1e2e; border: 1px solid #6c7086; border-radius: 3px;
    color: #cdd6f4; padding: 2px 5px; width: 80px; font-size: 11px; }
  .participant-persona-preview { color: #6c7086; font-size: 10px; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .participant-edit-btn { background: none; border: none; color: #89b4fa; cursor: pointer;
    font-size: 12px; padding: 0 3px; }
  .participant-expanded { margin-top: 5px; }
  .participant-expanded textarea { background: #1e1e2e; border: 1px solid #89b4fa; border-radius: 3px;
    color: #cdd6f4; padding: 4px 6px; width: 100%; box-sizing: border-box;
    font-size: 10px; height: 40px; resize: none; margin-top: 3px; }
  .participant-expanded select { background: #1e1e2e; border: 1px solid #6c7086; border-radius: 3px;
    color: #cdd6f4; padding: 2px 5px; font-size: 10px; width: 100%; margin-top: 3px; }
  .participant-add-btn { color: #89b4fa; font-size: 11px; cursor: pointer;
    background: none; border: none; padding: 2px 0; margin-top: 3px; }
  .participant-role-label { font-size: 11px; font-weight: 600; color: #cdd6f4; }
  .canvas { flex: 1; padding: 16px; overflow-y: auto; }
  .canvas h3 { font-size: 11px; text-transform: uppercase; color: #6c7086;
               margin-bottom: 12px; letter-spacing: 0.05em; }
  .stage-list { min-height: 120px; display: flex; flex-direction: column; gap: 6px; }
  .stage-item { background: #313244; border: 1px solid #45475a; border-radius: 8px;
                padding: 8px 12px; display: flex; justify-content: space-between;
                align-items: center; font-size: 13px; cursor: grab; }
  .stage-item:hover { border-color: #89b4fa; }
  .loop-item { border: 2px solid #f9e2af; border-radius: 8px; padding: 10px 12px; }
  .loop-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
                 font-size: 12px; color: #f9e2af; }
  .loop-header input[type=number] { width: 44px; background: #1e1e2e; border: 1px solid #6c7086;
                                     color: #cdd6f4; border-radius: 4px; padding: 2px 5px; }
  .loop-inner { min-height: 40px; background: #1e1e2e; border-radius: 6px; padding: 8px;
                display: flex; flex-direction: column; gap: 5px;
                border: 1px dashed #45475a; }
  .loop-inner .stage-item { font-size: 12px; padding: 5px 10px; }
  .remove-btn { background: none; border: none; color: #f38ba8; cursor: pointer;
                font-size: 16px; line-height: 1; padding: 0 4px; }
  .drop-zone { border: 2px dashed #45475a; border-radius: 8px; padding: 14px;
               text-align: center; color: #6c7086; font-size: 12px; margin-top: 8px; }
  .drop-zone.drag-over { border-color: #89b4fa; background: #1e3a5f22; }
  .preview { width: 280px; background: #181825; border-left: 1px solid #313244;
             padding: 12px; overflow-y: auto; }
  .preview h3 { font-size: 11px; text-transform: uppercase; color: #6c7086;
                margin-bottom: 10px; letter-spacing: 0.05em; }
  pre { font-size: 11px; color: #a6e3a1; white-space: pre-wrap; word-break: break-all; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #a6e3a1; color: #1e1e2e;
           padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
           display: none; z-index: 100; }
</style>
</head>
<body>
<header>
  <h1>🧩 Pipeline Config Builder</h1>
  <div style="display:flex;gap:8px">
    <button class="btn btn-secondary" onclick="clearAll()">Clear</button>
    <button class="btn" onclick="saveYaml()">Save pipeline.yaml ↓</button>
  </div>
</header>
<div class="layout">
  <div class="palette">
    <h3>Blocks</h3>
    <div id="palette-stages"></div>
    <div style="margin-top:12px;border-top:1px solid #313244;padding-top:12px">
      <div class="palette-item loop-block" draggable="true"
           ondragstart="dragStartLoop(event)">🔁 Loop</div>
      <div class="palette-item discuss-block" draggable="true"
           ondragstart="dragStartDiscuss(event)">💬 Discuss</div>
    </div>
  </div>
  <div class="canvas">
    <h3>Pipeline Sequence — drag to add or reorder</h3>
    <div class="stage-list" id="stage-list"
         ondragover="allowDrop(event)" ondrop="dropOnList(event)"></div>
    <div class="drop-zone" id="main-drop"
         ondragover="allowDrop(event,true)" ondrop="dropOnList(event)"
         ondragleave="this.classList.remove('drag-over')">
      Drop blocks here
    </div>
  </div>
  <div class="preview">
    <h3>pipeline.yaml preview</h3>
    <pre id="yaml-preview"></pre>
  </div>
</div>
<div class="toast" id="toast">✅ Saved!</div>

<script>
let stages = [];          // array of {type:'stage',name,label} | {type:'loop',max,until,stages:[]}
let dragSource = null;    // {context:'palette'|'list', index, loopIndex}
let palette = [];

async function init() {
  try {
    const [palRes, curRes] = await Promise.all([
      fetch('/palette').then(r => r.json()),
      fetch('/current').then(r => r.json()),
    ]);
    palette = palRes;
    renderPalette();
    if (curRes.yaml) {
      stages = parseYaml(curRes.yaml);
      render();
    }
  } catch (err) {
    console.error('Failed to initialise pipeline builder:', err);
    alert('Could not connect to the builder server: ' + err.message);
  }
}

function renderPalette() {
  const el = document.getElementById('palette-stages');
  el.innerHTML = '';
  palette.forEach(s => {
    const div = document.createElement('div');
    div.className = 'palette-item';
    div.draggable = true;
    div.textContent = s.label;
    div.title = s.description;
    div.ondragstart = e => dragStartPalette(e, s.name, s.label);
    el.appendChild(div);
  });
}

function dragStartPalette(e, name, label) {
  dragSource = {context:'palette', name, label};
  e.dataTransfer.effectAllowed = 'copy';
}

function dragStartLoop(e) {
  dragSource = {context:'palette', type:'loop'};
  e.dataTransfer.effectAllowed = 'copy';
}

function dragStartDiscuss(e) {
  dragSource = {context:'palette', type:'discuss'};
  e.dataTransfer.effectAllowed = 'copy';
}

function dragStartListItem(e, idx, loopIdx) {
  dragSource = {context:'list', index:idx, loopIndex:loopIdx};
  e.dataTransfer.effectAllowed = 'move';
  e.stopPropagation();
}

function allowDrop(e, highlight) {
  e.preventDefault();
  if (highlight) e.currentTarget.classList.add('drag-over');
}

function dropOnList(e) {
  e.preventDefault();
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  if (!dragSource) return;

  // Detect drop position from the nearest data-index element
  const targetItem = e.target.closest('[data-index]');
  const toIndex = targetItem ? parseInt(targetItem.dataset.index) : stages.length;

  if (dragSource.context === 'list' && dragSource.loopIndex === undefined) {
    // Reorder an existing top-level stage
    const moved = stages.splice(dragSource.index, 1)[0];
    const insertAt = dragSource.index < toIndex ? toIndex - 1 : toIndex;
    stages.splice(insertAt, 0, moved);
    dragSource = null;
    render();
    return;
  }

  if (dragSource.context === 'palette') {
    if (dragSource.type === 'loop') {
      stages.splice(toIndex, 0, {type:'loop', max:3, until:'APPROVED', stages:[]});
    } else if (dragSource.type === 'discuss') {
      stages.splice(toIndex, 0, {
        type: 'discuss',
        mode: 'inline',
        participants: [
          {role: 'analyst',  persona: '', llm: ''},
          {role: 'skeptic',  persona: '', llm: ''},
          {role: 'optimist', persona: '', llm: ''},
        ],
        preset_file: '',
        max_rounds: 2,
        output_mode: 'both',
        _expanded: {},
      });
    } else {
      stages.splice(toIndex, 0, {type:'stage', name:dragSource.name, label:dragSource.label});
    }
  }
  dragSource = null;
  render();
}

function dropOnLoop(e, loopIdx) {
  e.preventDefault(); e.stopPropagation();
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  if (!dragSource || dragSource.context !== 'palette' ||
    dragSource.type === 'loop' || dragSource.type === 'discuss') return;
  stages[loopIdx].stages.push({name:dragSource.name, label:dragSource.label});
  dragSource = null;
  render();
}

function removeItem(idx, loopIdx) {
  if (loopIdx !== undefined) {
    stages[idx].stages.splice(loopIdx, 1);
  } else {
    stages.splice(idx, 1);
  }
  render();
}

function clearAll() { stages = []; render(); }

function _esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setDiscussMode(idx, mode) {
  stages[idx].mode = mode;
  if (!stages[idx]._expanded) stages[idx]._expanded = {};
  render();
}

function addParticipant(idx) {
  stages[idx].participants.push({role: 'role_' + (stages[idx].participants.length + 1), persona: '', llm: ''});
  render();
}

function removeParticipant(idx, pi) {
  stages[idx].participants.splice(pi, 1);
  if (stages[idx]._expanded) {
    const newExpanded = {};
    for (const [k, v] of Object.entries(stages[idx]._expanded)) {
      const n = parseInt(k);
      if (n < pi) newExpanded[n] = v;
      else if (n > pi) newExpanded[n - 1] = v;
      // n === pi is deleted (the removed participant)
    }
    stages[idx]._expanded = newExpanded;
  }
  render();
}

function toggleParticipantExpanded(idx, pi) {
  if (!stages[idx]._expanded) stages[idx]._expanded = {};
  stages[idx]._expanded[pi] = !stages[idx]._expanded[pi];
  render();
}

function render() {
  const list = document.getElementById('stage-list');
  list.innerHTML = '';
  const clearDragOver = () => document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  stages.forEach((item, idx) => {
    if (item.type === 'stage') {
      const div = document.createElement('div');
      div.className = 'stage-item';
      div.draggable = true;
      div.dataset.index = idx;
      div.ondragstart = e => dragStartListItem(e, idx);
      div.ondragend = clearDragOver;
      div.innerHTML = `<span>${item.label}</span>
        <button class="remove-btn" onclick="removeItem(${idx})">×</button>`;
      list.appendChild(div);
    } else if (item.type === 'discuss') {
      const wrap = document.createElement('div');
      wrap.className = 'discuss-item';
      wrap.dataset.index = idx;
      wrap.draggable = true;
      wrap.ondragstart = e => dragStartListItem(e, idx);
      wrap.ondragend = clearDragOver;

      const buildParticipantRows = () => {
        if (!item.participants || !item.participants.length) {
          return '<div style="color:#6c7086;font-size:11px">No participants — click + Add</div>';
        }
        return item.participants.map((p, pi) => {
          const expanded = item._expanded && item._expanded[pi];
          const personaPreview = p.persona ? p.persona.slice(0, 55) + (p.persona.length > 55 ? '…' : '') : '';
          if (expanded) {
            return `<div class="participant-row">
              <div class="participant-row-header">
                <input class="participant-role-input" value="${_esc(p.role)}"
                  oninput="stages[${idx}].participants[${pi}].role=this.value.replace(/ /g,'_');updatePreview()">
                <button class="remove-btn" onclick="removeParticipant(${idx},${pi})">×</button>
              </div>
              <div class="participant-expanded">
                <div style="font-size:10px;color:#6c7086;margin-top:3px">Persona (optional)</div>
                <textarea placeholder="How this participant should behave..."
                  oninput="stages[${idx}].participants[${pi}].persona=this.value;updatePreview()"
                >${_esc(p.persona)}</textarea>
                <div style="font-size:10px;color:#6c7086;margin-top:3px">LLM override (optional)</div>
                <select onchange="stages[${idx}].participants[${pi}].llm=this.value;updatePreview()">
                  <option value="" ${!p.llm?'selected':''}>(default)</option>
                  <option value="openai" ${p.llm==='openai'?'selected':''}>openai</option>
                  <option value="grok" ${p.llm==='grok'?'selected':''}>grok</option>
                  <option value="codex" ${p.llm==='codex'?'selected':''}>codex</option>
                </select>
                <button class="participant-edit-btn" style="margin-top:4px;color:#6c7086"
                  onclick="toggleParticipantExpanded(${idx},${pi})">▲ collapse</button>
              </div>
            </div>`;
          } else {
            return `<div class="participant-row">
              <div class="participant-row-header">
                <span class="participant-role-label">${_esc(p.role)}</span>
                <span class="participant-persona-preview">${_esc(personaPreview)}</span>
                <button class="participant-edit-btn" onclick="toggleParticipantExpanded(${idx},${pi})">✏️</button>
                <button class="remove-btn" onclick="removeParticipant(${idx},${pi})">×</button>
              </div>
            </div>`;
          }
        }).join('');
      };

      const modeBody = item.mode === 'preset'
        ? `<label style="font-size:11px;color:#cdd6f4;display:block;margin-top:4px">Preset file</label>
           <input style="background:#1e1e2e;border:1px solid #6c7086;border-radius:4px;color:#cdd6f4;
             padding:3px 6px;width:100%;box-sizing:border-box;font-size:12px"
             placeholder="discussions/my-debate.yaml"
             value="${_esc(item.preset_file)}"
             oninput="stages[${idx}].preset_file=this.value;updatePreview()">`
        : `<div id="prows-${idx}">${buildParticipantRows()}</div>
           <button class="participant-add-btn" onclick="addParticipant(${idx})">+ Add participant</button>`;

      wrap.innerHTML = `
        <div class="discuss-header">
          💬 Discuss
          <button class="remove-btn" style="margin-left:auto" onclick="removeItem(${idx})">×</button>
        </div>
        <div class="discuss-form">
          <div class="discuss-mode-toggle">
            <button class="discuss-mode-btn${item.mode==='inline'?' active':''}"
              onclick="setDiscussMode(${idx},'inline')">Inline</button>
            <button class="discuss-mode-btn${item.mode==='preset'?' active':''}"
              onclick="setDiscussMode(${idx},'preset')">Preset file</button>
          </div>
          ${modeBody}
          <label>Max rounds</label>
          <input type="number" min="1" max="10" value="${item.max_rounds}"
                 onchange="stages[${idx}].max_rounds=parseInt(this.value)||1;updatePreview()">
          <label>Output mode</label>
          <select onchange="stages[${idx}].output_mode=this.value;updatePreview()">
            <option value="both" ${item.output_mode==='both'?'selected':''}>both</option>
            <option value="synthesis" ${item.output_mode==='synthesis'?'selected':''}>synthesis</option>
            <option value="transcript" ${item.output_mode==='transcript'?'selected':''}>transcript</option>
          </select>
        </div>`;
      list.appendChild(wrap);
    } else {
      const wrap = document.createElement('div');
      wrap.className = 'loop-item';
      wrap.dataset.index = idx;
      wrap.draggable = true;
      wrap.ondragstart = e => dragStartListItem(e, idx);
      wrap.innerHTML = `
        <div class="loop-header">
          🔁 Loop — max:
          <input type="number" min="1" max="10" value="${item.max}"
            oninput="stages[${idx}].max=parseInt(this.value)||1;updatePreview()">
          until:
          <select style="background:#1e1e2e;color:#cdd6f4;border:1px solid #6c7086;border-radius:4px;padding:2px"
            onchange="stages[${idx}].until=this.value;updatePreview()">
            <option value="APPROVED" ${item.until==='APPROVED'?'selected':''}>APPROVED</option>
            <option value="NEEDS_REVISION" ${item.until==='NEEDS_REVISION'?'selected':''}>NEEDS_REVISION</option>
            <option value="CHANGES REQUESTED" ${item.until==='CHANGES REQUESTED'?'selected':''}>CHANGES REQUESTED</option>
          </select>
          <button class="remove-btn" style="margin-left:auto" onclick="removeItem(${idx})">×</button>
        </div>
        <div class="loop-inner" id="loop-inner-${idx}"
          ondragover="allowDrop(event,true)" ondrop="dropOnLoop(event,${idx})"
          ondragleave="this.classList.remove('drag-over')">
          ${item.stages.map((s,si) => `
            <div class="stage-item">
              <span>${s.label}</span>
              <button class="remove-btn" onclick="removeItem(${idx},${si})">×</button>
            </div>`).join('')}
          ${item.stages.length===0?'<div style="color:#6c7086;font-size:11px;text-align:center">Drop stages here</div>':''}
        </div>`;
      list.appendChild(wrap);
    }
  });
  updatePreview();
}

function toYaml() {
  if (!stages.length) return '';
  let out = 'stages:\n';
  stages.forEach(item => {
    if (item.type === 'stage') {
      out += `  - ${item.name}\n`;
    } else if (item.type === 'discuss') {
      if (item.mode === 'preset') {
        if (item.preset_file) {
          // The backend supports discuss: {preset: path} mappings, so emit the
          // actual path to preserve files outside discussions/ (e.g. custom/foo.yaml).
          const escapedPath = item.preset_file.trim()
            .replace(/\\/g, '\\\\')
            .replace(/"/g, '\\"');
          out += `  - discuss:\n      preset: "${escapedPath}"\n`;
        }
      } else {
        out += `  - discuss:\n`;
        const parts = (item.participants || []).filter(p => p.role && p.role.trim());
        if (parts.length) {
          out += `      participants:\n`;
          parts.forEach(p => {
            out += `        - role: ${p.role.trim()}\n`;
            if (p.persona && p.persona.trim()) {
              // Escape backslashes first, then quotes and newlines.
              const escapedPersona = p.persona.trim()
                .replace(/\\/g, '\\\\')
                .replace(/"/g, '\\"')
                .replace(/\n/g, '\\n');
              out += `          persona: "${escapedPersona}"\n`;
            }
            if (p.llm && p.llm.trim()) out += `          llm: ${p.llm.trim()}\n`;
          });
        }
        out += `      max_rounds: ${item.max_rounds}\n`;
        out += `      output_mode: ${item.output_mode}\n`;
      }
    } else {
      out += `  - loop:\n`;
      out += `      max: ${item.max}\n`;
      out += `      until: ${item.until}\n`;
      out += `      stages:\n`;
      item.stages.forEach(s => { out += `        - ${s.name}\n`; });
    }
  });
  return out;
}

function updatePreview() {
  document.getElementById('yaml-preview').textContent = toYaml() || '# Empty pipeline';
}

function parseYaml(text) {
  // Minimal YAML parser for pipeline.yaml format (no external deps)
  const result = [];
  const lines = text.split('\n');
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    const stageMatch = line.match(/^\s{2}-\s+(\w+)\s*$/);
    const loopMatch = line.match(/^\s{2}-\s+loop:\s*$/);
    const discussMatch = line.match(/^\s{2}-\s+discuss:\s*$/);
    if (stageMatch && !discussMatch) {
      const name = stageMatch[1];
      if (name.startsWith('discuss_')) {
        // Reconstruct preset-mode discuss item from stage name.
        // Prepend discussions/ so the round-trip path resolves correctly.
        const stem = name.slice('discuss_'.length).replace(/_/g, '-');
        result.push({
          type:'discuss', mode:'preset',
          preset_file: 'discussions/' + stem + '.yaml',
          participants:[], max_rounds:2, output_mode:'both', _expanded:{},
        });
      } else {
        const pal = palette.find(p => p.name === name);
        result.push({type:'stage', name, label: pal ? pal.label : name});
      }
    } else if (loopMatch) {
      const loop = {type:'loop', max:3, until:'APPROVED', stages:[]};
      i++;
      while (i < lines.length) {
        const l = lines[i];
        const maxM = l.match(/^\s+max:\s+(\d+)/);
        const untilM = l.match(/^\s+until:\s+(\S+)/);
        const innerM = l.match(/^\s{8}-\s+(\w+)/);
        if (maxM) loop.max = parseInt(maxM[1]);
        else if (untilM) loop.until = untilM[1];
        else if (innerM) {
          const name = innerM[1];
          const pal = palette.find(p => p.name === name);
          loop.stages.push({name, label: pal ? pal.label : name});
        } else if (l.match(/^\s{2}-/)) { i--; break; }
        i++;
      }
      result.push(loop);
      continue;
    } else if (discussMatch) {
      const disc = {
        type:'discuss', mode:'inline',
        participants:[], preset_file:'',
        max_rounds:2, output_mode:'both', _expanded:{},
      };
      i++;
      let curParticipant = null;
      while (i < lines.length) {
        const l = lines[i];
        const roundsM   = l.match(/^\s+max_rounds:\s+(\d+)/);
        const modeM     = l.match(/^\s+output_mode:\s+(\S+)/);
        const presetM   = l.match(/^\s+preset:\s+(.+)/);
        const roleM     = l.match(/^\s+-\s+role:\s+(\S+)/);
        const personaM  = l.match(/^\s+persona:\s+"(.*?)"\s*$/);
        const llmM      = l.match(/^\s+llm:\s+(\S+)/);
        const plainRoleM = l.match(/^\s+-\s+(\w[\w-]*)\s*$/);
        if (roundsM) disc.max_rounds = parseInt(roundsM[1]);
        else if (modeM) { const v = ['both','synthesis','transcript']; disc.output_mode = v.includes(modeM[1]) ? modeM[1] : 'both'; }
        else if (presetM) {
          disc.mode = 'preset';
          // Single-pass unescape: handles \\, \", \n correctly.
          disc.preset_file = presetM[1].trim()
            .replace(/^"(.*)"$/, '$1')
            .replace(/\\(\\|n|")/g, (_, c) => c === '\\' ? '\\' : c === 'n' ? '\n' : '"');
        }
        else if (roleM) { curParticipant = {role:roleM[1], persona:'', llm:''}; disc.participants.push(curParticipant); }
        else if (personaM && curParticipant) {
          // Single-pass unescape: process escape sequences left-to-right so that
          // \\n (escaped backslash + n) is not converted to a newline.
          curParticipant.persona = personaM[1].replace(/\\(\\|n|")/g, (_, c) => c === '\\' ? '\\' : c === 'n' ? '\n' : '"');
        }
        else if (llmM && curParticipant) { curParticipant.llm = llmM[1]; }
        // Break on a top-level list item (2-space indent) BEFORE checking plainRoleM,
        // so a line like "  - engineer" correctly ends the discuss block instead of
        // being consumed as an inline participant.
        else if (l.match(/^\s{2}-/)) { i--; break; }
        else if (plainRoleM && !l.match(/^\s+-\s+(role|persona|llm|preset|participants|max_rounds|output_mode):/)) {
          curParticipant = {role:plainRoleM[1], persona:'', llm:''};
          disc.participants.push(curParticipant);
        }
        i++;
      }
      result.push(disc);
      continue;
    }
    i++;
  }
  return result;
}

async function saveYaml() {
  // Validate before saving
  for (let i = 0; i < stages.length; i++) {
    const s = stages[i];
    if (s.type === 'loop') {
      if (!s.stages || s.stages.length === 0) {
        alert(`Loop block at position ${i + 1} must have at least one inner stage.`);
        return;
      }
      if (!s.until) {
        alert(`Loop block at position ${i + 1} must have an "until" verdict set.`);
        return;
      }
      if (!s.max || s.max < 1) {
        alert(`Loop block at position ${i + 1} must have max ≥ 1.`);
        return;
      }
    }
    if (s.type === 'discuss') {
      if (s.mode === 'preset' && !s.preset_file.trim()) {
        alert(`Discuss block at position ${i + 1} (Preset mode) requires a preset file path.`);
        return;
      }
      if (s.mode === 'inline' && !s.participants.some(p => p.role && p.role.trim())) {
        alert(`Discuss block at position ${i + 1} has no valid participants.`);
        return;
      }
    }
  }
  const yaml = toYaml();
  if (!yaml) { alert('Pipeline is empty — add some stages first.'); return; }
  try {
    const resp = await fetch('/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({yaml}),
    });
    const data = await resp.json();
    if (data.ok) {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', 2500);
    } else {
      alert('Save failed: ' + data.error);
    }
  } catch (err) {
    alert('Network error — could not save: ' + err.message);
  }
}

// Clear any lingering drag-over highlights when drag is abandoned
document.addEventListener('dragend', () => {
  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragSource = null;
});

init();
</script>
